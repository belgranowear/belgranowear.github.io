name: rebuild
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # every day at 12:00 a.m. (primary run)
    - cron: "0 6 * * *" # retry, only if no successful run today
    - cron: "0 12 * * *" # retry, only if no successful run today

permissions:
  actions: read
  contents: write

# Retries queue behind an in-progress run instead of racing it.
concurrency:
  group: rebuild
  cancel-in-progress: false

jobs:

  update:
    runs-on: ubuntu-22.04
    steps:
      - name: Show run context
        run: |
          echo "event=${GITHUB_EVENT_NAME}"
          echo "schedule=${{ github.event.schedule }}"
          echo "workflow=${GITHUB_WORKFLOW}"
          echo "run_id=${GITHUB_RUN_ID}"
          echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"

      - name: Skip retry if today's update already succeeded
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          IS_RETRY: ${{ github.event_name == 'schedule' && github.event.schedule != '0 0 * * *' }}
        run: |
          if [ "${IS_RETRY}" != "true" ]; then
            echo "Primary or manual run; always updating."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          today="$(date -u +%F)"
          successes="$(gh run list \
            --repo "${GITHUB_REPOSITORY}" \
            --workflow rebuild.yml \
            --status success \
            --created ">=${today}" \
            --json databaseId \
            --jq 'length')"

          echo "Successful runs since ${today}: ${successes}"

          if [ "${successes}" -gt 0 ]; then
            echo "::notice title=Retry skipped::Schedule data was already updated today."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Regenerate static data
        if: steps.guard.outputs.skip != 'true'
        uses: ./

      - name: Update repository
        if: steps.guard.outputs.skip != 'true'
        run: ./update-pages.sh
